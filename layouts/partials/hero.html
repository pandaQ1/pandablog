<section class="hero-banner">
  <div class="hero-text">
    <h1>{{ .Site.Params.heroTitle | default .Site.Title }}</h1>
    {{ with .Site.Params.slogan }}<p>{{ . }}</p>{{ end }}
  </div>
  <a class="hero-arrow" href="#posts" aria-label="向下浏览">
    <svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9.5l6 6 6-6"></path></svg>
  </a>
</section>
