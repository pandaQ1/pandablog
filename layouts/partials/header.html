<header class="site-header">
  <div class="container header-inner">
    <a href="{{ .Site.BaseURL | relLangURL }}" class="site-title">
      <img src="{{ .Site.Params.avatar | relURL }}" alt="avatar" class="nav-avatar">
      <span>{{ .Site.Title }}</span>
    </a>
    <nav class="site-nav">
      {{ range .Site.Menus.main }}
      <a href="{{ .URL }}" {{ if $.IsMenuCurrent "main" . }}class="active"{{ end }}>{{ .Name }}</a>
      {{ end }}
      <a href="{{ "search/" | relURL }}" class="search-btn" title="搜索">🔍</a>
    </nav>
  </div>
</header>
