<header class="site-header" id="site-header">
  <div class="header-inner">
    <a href="{{ .Site.BaseURL | relLangURL }}" class="site-title">
      <img src="{{ .Site.Params.avatar | relURL }}" alt="avatar" class="nav-avatar">
      <span>{{ .Site.Title }}</span>
    </a>
    <nav class="site-nav">
      {{ range .Site.Menus.main }}
      <a href="{{ .URL }}" {{ if $.IsMenuCurrent "main" . }}class="active"{{ end }}>{{ .Name }}</a>
      {{ end }}
      {{ with .Site.Params.bilibili }}
      <a href="{{ . }}" target="_blank" rel="noopener">bilibili个人主页</a>
      {{ end }}
      <a href="{{ "search/" | relURL }}" class="search-btn" title="搜索" aria-label="搜索">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20.5 20.5l-4.2-4.2"></path></svg>
      </a>
    </nav>
  </div>
</header>
