<aside class="sidebar">
  {{ with .Site.Params.announcement }}
  <section class="widget glass">
    <h3 class="widget-title">公告</h3>
    <p>{{ . }}</p>
  </section>
  {{ end }}

  {{ with .Site.Params.notice }}
  <section class="widget glass">
    <h3 class="widget-title">{{ $.Site.Params.noticeTitle | default "公告栏" }}</h3>
    <p>{{ . }}</p>
  </section>
  {{ end }}

  <section class="widget glass">
    <h3 class="widget-title">搜索</h3>
    <form class="side-search" action="{{ "search/" | relURL }}" method="get">
      <input type="search" name="q" placeholder="搜索…" aria-label="搜索">
      <button type="submit" title="搜索" aria-label="搜索">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20.5 20.5l-4.2-4.2"></path></svg>
      </button>
    </form>
  </section>

  <section class="widget glass profile">
    <img src="{{ .Site.Params.avatar | relURL }}" alt="{{ .Site.Params.author }}">
    <div class="profile-name">{{ .Site.Params.author }}</div>
    {{ with .Site.Params.signature }}<div class="profile-sign">{{ . }}</div>{{ end }}
  </section>
</aside>
