<footer class="site-footer">
  <div class="container">
    <p>
      {{ .Site.Copyright }} ·
      Powered by <a href="https://gohugo.io/" target="_blank" rel="noopener">Hugo</a> ·
      <a href="{{ "index.xml" | relURL }}">RSS</a>
    </p>
  </div>
</footer>
<script>
(function () {
  var header = document.getElementById('site-header');
  if (!header) return;
  var onScroll = function () { header.classList.toggle('scrolled', window.scrollY > 8); };
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();
  // hero 箭头点击平滑滚到文章区（不影响滚轮速度）
  document.querySelectorAll('.hero-arrow').forEach(function (a) {
    a.addEventListener('click', function (e) {
      var t = document.querySelector(a.getAttribute('href'));
      if (t) { e.preventDefault(); t.scrollIntoView({ behavior: 'smooth' }); }
    });
  });
  // 首页 banner 逐字打字效果（原站 Argon banner data-interval="100"）
  (function () {
    var titleEl = document.querySelector('.banner-title-inner');
    var subEl = document.querySelector('.banner-subtitle');
    if (!titleEl) return;
    var tText = titleEl.getAttribute('data-text') || '';
    var sText = subEl ? (subEl.getAttribute('data-text') || '') : '';
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      titleEl.textContent = tText;
      if (subEl) subEl.textContent = sText;
      return;
    }
    var INTERVAL = 100, i = 0, j = 0;
    var typeTitle = function () {
      if (i <= tText.length) {
        titleEl.textContent = tText.slice(0, i);
        i++;
        setTimeout(typeTitle, INTERVAL);
      } else if (sText) {
        setTimeout(typeSub, 250);
      }
    };
    var typeSub = function () {
      if (j <= sText.length) {
        subEl.textContent = sText.slice(0, j);
        j++;
        setTimeout(typeSub, INTERVAL);
      }
    };
    typeTitle();
  })();
})();
</script>
