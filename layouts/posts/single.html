{{ define "main" }}
<article class="post">
  <header class="post-header">
    <h1>{{ .Title }}</h1>
    <div class="post-meta">
      <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006-01-02" }}</time>
      {{ with .GetTerms "tags" }}
        {{ range . }}<a class="tag" href="{{ .RelPermalink }}">#{{ .LinkTitle }}</a>{{ end }}
      {{ end }}
      <span>{{ .ReadingTime }} 分钟阅读</span>
    </div>
  </header>
  {{ .Content }}
  {{ partial "comments.html" . }}
</article>
{{ end }}
