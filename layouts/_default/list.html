{{ define "main" }}
<h1 class="page-title glass">{{ .Title }}</h1>
{{ range .Pages }}
<article class="post-card glass">
  <header class="post-header">
    <a class="post-title" href="{{ .RelPermalink }}">{{ .Title }}</a>
    <div class="post-meta">
      <span class="post-meta-detail">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M16 3v4M8 3v4M3 11h18"></path></svg>
        <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006-01-02" }}</time>
      </span>
      <span class="post-meta-devide">|</span>
      <span class="post-meta-detail">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 3"></path></svg>
        预计阅读 {{ .ReadingTime }} 分钟
      </span>
    </div>
  </header>
  <div class="post-content-summary">{{ .Summary | plainify | truncate 175 }}</div>
  {{ with .GetTerms "tags" }}
  <div class="post-tags">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"></path><circle cx="7.5" cy="7.5" r="1.5"></circle></svg>
    {{ range . }}<a class="tag-badge" href="{{ .RelPermalink }}">{{ .LinkTitle }}</a>{{ end }}
  </div>
  {{ end }}
</article>
{{ else }}
<article class="post-card glass"><div class="post-content-summary">这里暂时没有内容。</div></article>
{{ end }}
{{ end }}
