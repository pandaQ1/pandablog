{{ define "main" }}
<h1 class="page-title glass">{{ .Title }}</h1>
{{ range .Pages }}
<article class="post-card glass">
  <h2 class="post-card-title"><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
  <div class="post-meta">
    <span><span class="icon">📅</span><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006-01-02" }}</time></span>
    {{ with .GetTerms "tags" }}<span><span class="icon">🏷</span>{{ range . }}<a class="tag" href="{{ .RelPermalink }}">{{ .LinkTitle }}</a>{{ end }}</span>{{ end }}
    <span><span class="icon">✏️</span>{{ .WordCount }} 字</span>
  </div>
  <p class="post-summary">{{ .Summary | plainify | truncate 110 }}</p>
</article>
{{ else }}
<article class="post-card glass"><p>这里暂时没有内容。</p></article>
{{ end }}
{{ end }}
