<!DOCTYPE html>
<html lang="{{ .Site.Language.LanguageCode }}">
{{- partial "head.html" . -}}
<body>
  <div class="bg-layer" style="background-image: url('{{ .Site.Params.background | relURL }}')"></div>
  <div class="bg-mask"></div>
  <div class="page">
    {{- partial "header.html" . -}}
    <div class="container page-body">
      {{- partial "sidebar.html" . -}}
      <main class="content">
        {{- block "main" . }}{{ end -}}
      </main>
    </div>
    {{- partial "footer.html" . -}}
  </div>
</body>
</html>
