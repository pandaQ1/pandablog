{{ define "main" }}
<h1 class="page-title glass">归档</h1>
<section class="archive-body glass">
  <p class="archive-count">共 {{ where .Site.RegularPages "Type" "posts" | len }} 篇文章</p>
  {{ $pages := where .Site.RegularPages "Type" "posts" }}
  {{ range $pages.GroupByDate "2006" }}
  <section class="archive-year">
    <h2>{{ .Key }}</h2>
    <ul class="archive-list">
      {{ range .Pages }}
      <li>
        <time>{{ .Date.Format "01-02" }}</time>
        <a href="{{ .RelPermalink }}">{{ .Title }}</a>
      </li>
      {{ end }}
    </ul>
  </section>
  {{ end }}
</section>
{{ end }}
