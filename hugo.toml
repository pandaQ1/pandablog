baseURL = "https://pandaq1.github.io/pandablog/"
defaultContentLanguage = "zh-cn"
defaultContentLanguageInSubdir = false
title = "Panda Blog"
copyright = "© 2026 Panda Blog"
pagination.pagerSize = 10
enableEmoji = true
summaryLength = 70

[taxonomies]
  tag = "tags"
  category = "categories"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[menus]
  [[menus.main]]
    name = "文章"
    pageRef = "/"
    weight = 10
  [[menus.main]]
    name = "留言板"
    pageRef = "/guestbook/"
    weight = 20
  [[menus.main]]
    name = "说说"
    pageRef = "/shuoshuo/"
    weight = 30
  [[menus.main]]
    name = "归档"
    pageRef = "/archives/"
    weight = 40
  [[menus.main]]
    name = "友情链接"
    pageRef = "/friends/"
    weight = 50
  [[menus.main]]
    name = "关于"
    pageRef = "/about/"
    weight = 60

[params]
  description = "记录自己技术增长过程的博客"
  author = "panda"
  # 导航栏品牌文字（原站 navbar-brand 显示为 panda，彩虹渐变）
  brand = "panda"
  # 首页顶部大标题与口号（与原站 banner 文案一致）
  heroTitle = "panda‘s blog"
  slogan = "Life is a coding,I will debug it."
  signature = "Actions speak louder than words"
  avatar = "images/avatar.png"
  background = "images/bg.jpg"
  # 侧边栏「公告」卡片
  announcement = "记录自己技术增长过程的博客"
  # 侧边栏「公告栏」卡片
  noticeTitle = "panda公告栏"
  notice = "No pains, no gains."
  # 导航栏 bilibili 入口（原站地址）
  bilibili = "https://space.bilibili.com/100025796"
  # 开启 giscus 评论（详见 README，先到 https://giscus.app 生成参数）
  # repoId 已查好，还差 categoryId（开启 Discussions 并装好 giscus App 后到 giscus.app 获取）
  # [params.giscus]
  #   repo = "pandaQ1/pandablog"
  #   repoId = "R_kgDOU32uYw"
  #   category = "Announcements"
  #   categoryId = "你的分类ID"
  #   mapping = "pathname"
  #   theme = "preferred_color_scheme"
