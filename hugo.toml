baseURL = "https://pandaq1.github.io/pandablog/"
defaultContentLanguage = "zh-cn"
defaultContentLanguageInSubdir = false
title = "Panda Blog"
copyright = "© 2026 Panda Blog"
pagination.pagerSize = 10
enableEmoji = true
summaryLength = 70

[taxonomies]
  tag = "tags"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[menus]
  [[menus.main]]
    name = "文章"
    pageRef = "/"
    weight = 10
  [[menus.main]]
    name = "说说"
    pageRef = "/shuoshuo/"
    weight = 20
  [[menus.main]]
    name = "留言板"
    pageRef = "/guestbook/"
    weight = 30
  [[menus.main]]
    name = "归档"
    pageRef = "/archives/"
    weight = 40
  [[menus.main]]
    name = "友情链接"
    pageRef = "/friends/"
    weight = 50
  [[menus.main]]
    name = "关于"
    pageRef = "/about/"
    weight = 60

[params]
  description = "Panda 的个人博客 - 记录生活与技术"
  author = "Panda"
  avatar = "images/avatar.png"
  background = "images/bg.png"
